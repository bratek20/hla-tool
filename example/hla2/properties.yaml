profiles:
  - name: "kotlin2"
    language: "KOTLIN"
    paths:
      project: "../kotlin2"
      src:
        default: "src/main/kotlin/com/other/pkg"
        overrides:
            - submodule: "Tests"
              path: "src/test/kotlin/com/other/pkg"
            - submodule: "Fixtures"
              path: "src/testFixtures/kotlin/com/other/pkg"
    imports:
      - hlaFolderPath: "../hla"
        profileName: "kotlin"

  - name: "typeScript2"
    language: "TYPE_SCRIPT"
    paths:
      project: "../typescript2"
      src:
        default: "main"
        overrides:
            - submodules:
                - "Tests"
                - "Fixtures"
              path: "Tests"
    imports:
      - hlaFolderPath: "../hla"
        profileName: "typeScript"

  - name: "typeScript2Modern"
    language: "TYPE_SCRIPT"
    paths:
      project: "../typescript2-modern"
      src:
        default: "main"
        overrides:
          - submodules:
              - "Tests"
              - "Fixtures"
            path: "Tests"
    imports:
      - hlaFolderPath: "../hla"
        profileName: "typeScript"
    typeScript:
      mainTsconfigPath: "Configs/tsconfig.main.json"
      testTsconfigPath: "Configs/tsconfig.test.json"
      launchJsonPath: ""
      packageJsonPath: ""
      modern: true

  - name: "cSharp2"
    language: "C_SHARP"
    imports:
      - hlaFolderPath: "../hla"
        profileName: "cSharp"
    paths:
      project: "../c-sharp2"
      src:
        default: ""